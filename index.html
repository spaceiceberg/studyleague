<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="ThePenguin" content="width=device-width, initial-scale=1.0">
    <title>Study League</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content"></div>
    
    <h1 class="headers">Start your study!</h1>

    <div id="container">
        <div id="display">
            00:00:00:00
        </div>
        <div id="controls">
            <button id="startBtn" onclick="start()">Start</button>
            <button id="stopBtn" onclick="stoptimer()">Stop</button>
            <button id="resetBtn" onclick="reset()">Reset</button>
        </div>
    </div>
    <div>
        <h2 class="headers">Session time</h2>
        <div id="container">
                <div id="timelapse">
                    00:00:00:00
                </div>
        </div>

    </div>


    <script src="index.js"></script>
</body>
</html>
